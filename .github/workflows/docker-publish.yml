name: Publicar Imagem no Docker Hub & Deploy Portainer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      auto_deploy:
        description: 'Atualizar stack/serviço automaticamente no Portainer?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    # Pula o build se a mensagem de commit contiver [skip docker]
    if: "!contains(github.event.head_commit.message, '[skip docker]')"
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🔢 Obter Versão do Projeto
        id: get_version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d ' \n\r')
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão a ser publicada: $VERSION"

      - name: 🔐 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🛠️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: aryalvesfernandes/landingpage-iskcon-ce:${{ steps.get_version.outputs.VERSION }}

      - name: ✅ Confirmação do Build
        run: |
          echo "🎉 Imagem aryalvesfernandes/landingpage-iskcon-ce:${{ steps.get_version.outputs.VERSION }} publicada com sucesso no Docker Hub!"

  deploy-portainer:
    name: Atualizar Stack/Serviço no Portainer
    needs: build-and-push
    runs-on: ubuntu-latest
    # Executa se não houver [skip deploy] no commit
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"

    steps:
      - name: 🌐 Disparar Webhook do Portainer (com Tag da Nova Versão)
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_PORTAINER || secrets.PORTAINER_WEBHOOK_URL || secrets.WEBHOOK_OFICIAL }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "ℹ️ Webhook do Portainer não configurado nos Secrets (WEBHOOK_PORTAINER). O build no Docker Hub foi concluído, mas o deploy automático no Portainer foi pulado."
            exit 0
          fi

          echo "📡 Disparando atualização no Portainer para a versão: $VERSION..."
          
          # Se a URL já contiver '?', usa '&tag=', senão usa '?tag=' (compatível com Stack Webhook e Service Webhook)
          if [[ "$WEBHOOK_URL" == *"?"* ]]; then
            TARGET_URL="${WEBHOOK_URL}&tag=${VERSION}"
          else
            TARGET_URL="${WEBHOOK_URL}?tag=${VERSION}"
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$TARGET_URL" || curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL")
          
          echo "🚀 Portainer notificado com sucesso (HTTP $HTTP_STATUS)! Nova imagem $VERSION aplicada."
