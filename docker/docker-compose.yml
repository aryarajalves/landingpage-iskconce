version: '3.8'

services:
  iskcon_landingpage:
    image: aryalvesfernandes/landingpage-iskcon-ce:1.0.3
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - network_swarm_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      labels:
        - "traefik.enable=1"
        - "traefik.http.routers.iskcon_landingpage.rule=Host(`infotemplo-hare-krsna.aryaraj.shop`)"
        - "traefik.http.routers.iskcon_landingpage.entrypoints=websecure"
        - "traefik.http.routers.iskcon_landingpage.priority=1"
        - "traefik.http.routers.iskcon_landingpage.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.iskcon_landingpage.service=iskcon_landingpage"
        - "traefik.http.services.iskcon_landingpage.loadbalancer.server.port=80"
        - "traefik.http.services.iskcon_landingpage.loadbalancer.passHostHeader=1"

networks:
  network_swarm_public:
    name: network_swarm_public
    external: true
