name: Verificação de Segurança, Linter e Testes (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    name: Qualidade, Segurança e Testes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar Dependências do Frontend
        working-directory: frontend
        run: npm ci

      - name: 🔍 Análise de Linter (ESLint & Boas Práticas)
        working-directory: frontend
        run: npm run lint

      - name: 📐 Verificação de Tipos TypeScript (Typecheck)
        working-directory: frontend
        run: npm run typecheck

      - name: 🛡️ Varredura de Vulnerabilidades em Bibliotecas (Security Check)
        working-directory: frontend
        run: npm run security:check

      - name: 🧪 Executar Testes Unitários (Vitest)
        working-directory: frontend
        run: npm test

      - name: 🏗️ Validar Build de Produção
        working-directory: frontend
        run: npm run build
